function obterImagem(codigo){
  return `imagens/${codigo}.jpg`;
}

function salvarImagem(codigo, file){
  if(!admin) {
    alert("Apenas o administrador pode alterar imagens");
    return;
  }

}

function gerarQRCode(codigo){
  const qrDiv = document.getElementById("qrcode");
  qrDiv.innerHTML = "";
  new QRCode(qrDiv, {
    text: location.origin + location.pathname + "#" + codigo,
    width: 120,
    height: 120
  });
}

function mostrarProdutos(lista = produtos){
 document.getElementById("produto").innerHTML = "";
  document.getElementById("lista").innerHTML = lista.map((p,i)=>`
    <div class="card" onclick="abrirProduto(${i})">
      <img src="${obterImagem(p.codigo)}"
           onerror="this.src='imagens/sem-imagem.jpg'">
      <div>
        <b>${p.codigo}</b><br>
        ${p.nome}
      </div>
    </div>
  `).join("");
}

function abrirProduto(i){
  const p = produtos[i];

  const entrada = parseInt(localStorage.getItem(p.codigo+"_entrada")) || 0;
  const saida   = parseInt(localStorage.getItem(p.codigo+"_saida")) || 0;
  const minimo  = parseInt(localStorage.getItem(p.codigo+"_minimo")) || 0;
  const saldo   = entrada - saida;

  document.getElementById("lista").innerHTML = "";
  document.getElementById("produto").innerHTML = `
    <h2>${p.nome}</h2>

    <img id="imgProduto"
     src="${obterImagem(p.codigo)}"
     onerror="this.src='imagens/sem-imagem.jpg'"
     width="200"><br><br>

    <label><b>Imagem do produto</b></label><br>
    <input type="file" accept="image/*"
      ${admin ? "" : "disabled"}
      onchange="salvarImagem('${p.codigo}', this.files[0])"><br><br>

    <b>Código:</b> ${p.codigo}<br>
    <b>CA:</b> ${p.ca}<br><br>

   <label>Entrada:</label><br>
<input id="entrada" type="number" value="${entrada}"
  ${admin ? "" : "disabled"}
  oninput="atualizar('${p.codigo}')"><br><br>

<label>Saída:</label><br>
<input id="saida" type="number" value="${saida}"
  ${admin ? "" : "disabled"}
  oninput="atualizar('${p.codigo}')"><br><br>

    <label>Saldo:</label><br>
    <input id="saldo" type="number" value="${saldo}" readonly><br><br>

    <label>Estoque mínimo:</label><br>
    <input id="minimo" type="number" value="${minimo}"
      ${admin ? "" : "disabled"}
      oninput="atualizar('${p.codigo}')"><br><br>

    <h3>QR Code do Produto</h3>
    <div id="qrcode"></div><br>

    <button onclick="mostrarProdutos()">Voltar</button>
  `;

  gerarQRCode(p.codigo);
}

function atualizar(codigo){
  if(!admin){
    alert("Somente o administrador pode controlar entrada e saída.");
    abrirProduto(produtos.findIndex(p => p.codigo === codigo));
    return;
  }

  const entradaVal = parseInt(entrada.value) || 0;
  const saidaVal   = parseInt(saida.value) || 0;
  const saldoVal   = entradaVal - saidaVal;

  localStorage.setItem(codigo+"_entrada", entradaVal);
  localStorage.setItem(codigo+"_saida", saidaVal);

  document.getElementById("saldo").value = saldoVal;
}
function padronizarImagem(codigo, file) {
  if (!admin) {
    alert("Apenas o administrador pode alterar imagens");
    return;
  }

  const img = new Image();
  const reader = new FileReader();

  reader.onload = e => img.src = e.target.result;

  img.onload = () => {
    const TAM = 300;
    const canvas = document.createElement("canvas");
    canvas.width = TAM;
    canvas.height = TAM;

    const ctx = canvas.getContext("2d");

    // fundo branco
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, TAM, TAM);

    // cálculo de corte central
    const scale = Math.max(TAM / img.width, TAM / img.height);
    const w = img.width * scale;
    const h = img.height * scale;
    const x = (TAM - w) / 2;
    const y = (TAM - h) / 2;

    ctx.drawImage(img, x, y, w, h);

    // gera imagem final
    const link = document.createElement("a");
    link.download = `${codigo}.jpg`;
    link.href = canvas.toDataURL("image/jpeg", 0.9);
    link.click();

    alert(
      `Imagem padronizada com sucesso!\n\n` +
      `Arquivo gerado: ${codigo}.jpg\n` +
      `Coloque esse arquivo na pasta /imagens`
    );

    document.getElementById("imgProduto").src = link.href;
  };

  reader.readAsDataURL(file);
}

function filtrarProdutos(){
  const t = busca.value.toLowerCase();
  mostrarProdutos(produtos.filter(p =>
    p.nome.toLowerCase().includes(t) ||
    p.codigo.toLowerCase().includes(t)
  ));
}
window.onload = () => {

  const hash = location.hash.replace("#", "");

  index !== -1 ? abrirProduto(index) : mostrarProdutos();
